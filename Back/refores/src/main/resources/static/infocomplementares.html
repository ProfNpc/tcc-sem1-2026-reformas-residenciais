<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!--<link rel="stylesheet" href="./scriptReforma.js" />-->
    <link rel="stylesheet" href="css/cadastro.css" />

    <title>ReformaJá | Reformas Residenciais</title>

      


</head>

<body>

<div class="form-container">

  <h2>Informações do especialista</h2>

  <div class="input-group">
    <label>Nome completo</label>
    <input type="text" placeholder="Digite seu nome completo" />
  </div>

  <div class="input-group">
    <label>Email</label>
    <input type="email" placeholder="Digite seu email" />
  </div>

  <div class="input-group">
    <label>Telefone</label>
    <input type="tel" placeholder="(00) 00000-0000" />
  </div>

  <div class="input-group">
    <label>Endereço</label>
    <input type="text" placeholder="Rua, número, bairro" />
  </div>

  <div class="input-group">
    <label>Cidade</label>
    <input type="text" placeholder="Sua cidade" />
  </div>

  <div class="input-group">
    <label>Senha</label>
    <input type="password" placeholder="Crie uma senha" />
  </div>







  
   <button type="button" id="btn-submit-cad" class="btn-submit-cad">Cadastrar</button>


  <script src="codigo/cadastro.js"></script>

</div>
</body>
</html>
